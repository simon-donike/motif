# @package _global_
defaults:
  - override /sources: era5_pmw
  - override /lightning_module: flow_matching
  - override /lr_scheduler: cosine_warmup_100epochs
  - override /metrics: none
  - override /model: motif_12b_d512

wandb:
  name: fm_era5_pmw
  group: fm_era5_pmw

lightning_module:
  patch_size: 4
  mask_only_sources: ['pmw']

model:
  dropout: 0.0

dataset:
  train:
    dt_min: -3.0
    dt_max: 3.0
    groups_availability:
      pmw:
        sources: ['pmw']
        availability: [2, 2]
      era5:
        sources: ['era5']
        availability: [1, 1]
